<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found · Clark Suan</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0b'/%3E%3Ctext x='50' y='68' font-family='sans-serif' font-size='52' font-weight='700' fill='%23d8d3c8' text-anchor='middle'%3ECS%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .notfound {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: var(--pad);
      position: relative;
      z-index: 2;
    }
    .notfound__code {
      font-size: clamp(96px, 22vw, 240px);
      font-weight: 700;
      line-height: .9;
      letter-spacing: -.04em;
      background: linear-gradient(180deg, #f4f3f1, #6b5842);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .notfound h1 { font-size: clamp(22px, 4vw, 34px); font-weight: 600; margin: 8px 0 14px; letter-spacing: -.02em; }
    .notfound p { color: var(--muted); max-width: 44ch; margin: 0 auto 32px; }
    .notfound__actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .notfound__btn {
      border: 1px solid var(--line-2);
      padding: 13px 26px;
      border-radius: 50px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: background .25s, color .25s, transform .2s;
    }
    .notfound__btn:hover { background: var(--accent); color: #14110c; transform: translateY(-2px); }
    .notfound__btn--ghost:hover { background: transparent; color: var(--text); border-color: var(--line); }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="notfound">
    <div>
      <div class="notfound__code">404</div>
      <h1>This page went off-brief.</h1>
      <p>The link is broken or the page has moved. Let's get you back to something that ships.</p>
      <div class="notfound__actions">
        <a href="/index.html" class="notfound__btn">← Back home</a>
        <a href="/works.html" class="notfound__btn notfound__btn--ghost">View works</a>
      </div>
    </div>
  </main>
</body>
</html>
